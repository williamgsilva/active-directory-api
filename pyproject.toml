[project]
name = "active-directory-api"
version = "0.4.0"
description = "API central de autenticação e autorização no Active Directory (on-premises) para aplicações internas"
readme = "README.md"
license = "MIT"
authors = [{ name = "William Gonçalves da Silva" }]
requires-python = "3.13.*"
dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.32.0,<1.0.0)",
    "ldap3 (>=2.9.1,<3.0.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
    "cryptography (>=46.0.3,<47.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "alembic (>=1.15.0,<2.0.0)",
]

[project.urls]
Repository = "https://github.com/williamgsilva/active-directory-api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.28"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
testpaths = ["tests"]
