# Build e publicação da imagem a cada tag. Variáveis (Settings > CI/CD > Variables):
#   REGISTRY           ex.: registry.example.com
#   REGISTRY_USER      usuário do registry
#   REGISTRY_PASSWORD  senha/token do registry (masked)
stages:
  - build

build_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "${REGISTRY_PASSWORD}" | docker login --username "${REGISTRY_USER}" --password-stdin "${REGISTRY}"
    - export CURRENT_VERSION=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
    - echo "Versão detectada do pyproject.toml: ${CURRENT_VERSION}"
    # O Docker exige nome de imagem em minúsculas; o path do projeto pode ter maiúsculas
    - export IMAGE_NAME=${REGISTRY}/$(echo "${CI_PROJECT_PATH}" | tr '[:upper:]' '[:lower:]')
    - export PATCH_NAME=${IMAGE_NAME}:${CURRENT_VERSION}
    - export LATEST_NAME=${IMAGE_NAME}:latest
  script:
    - docker build -t "${PATCH_NAME}" --pull --no-cache .
    - docker push "${PATCH_NAME}"
    # Versão com letras (alpha, beta, rc...) não atualiza a tag latest
    - |
      if [[ "${CURRENT_VERSION}" =~ [a-zA-Z] ]]; then
        echo "Versão de pré-lançamento (${CURRENT_VERSION}): 'latest' não será atualizada."
      else
        docker tag "${PATCH_NAME}" "${LATEST_NAME}"
        docker push "${LATEST_NAME}"
      fi
  after_script:
    - docker logout "${REGISTRY}"
