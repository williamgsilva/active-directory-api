# Só para desenvolvimento (ex.: gerar nova migration). Em runtime o app.bootstrap aplica as migrations.
#   alembic revision -m "descricao"      (o banco vem das DATABASE_* do config/app.env)
#   alembic upgrade head
[alembic]
script_location = app/db/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
